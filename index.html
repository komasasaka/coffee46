<style>
  /* Android 端末に入っている等幅の英字フォント。Chrome は名前を書いただけでは使わないので local() で呼ぶ */
  @font-face { font-family: "AndroidMono"; src: local("Droid Sans Mono"), local("DroidSansMono"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --fs: 1.125rem; } /* 全体の文字の大きさ（18px）。入力欄は16px以上でないと iOS で自動ズームする */
  html {
    /* iOS の自動文字拡大を止める */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", "Hiragino Sans", sans-serif;
    background: #f0f2f5;
    color: #222;
    min-height: 100vh;
    min-height: 100dvh; /* iOS のアドレスバー分を除いた実高さ */
    display: flex;
    justify-content: center;
    /* ノッチ／ホームバーを避ける */
    padding: calc(20px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
             calc(20px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 480px;
    padding: 28px 24px 24px;
  }
  h1 {
    font-size: 1.35rem;
    text-align: center;
    margin-bottom: 18px;
  }
  /* 文字の大きさは、タイトル・注湯テーブルの数字・バージョン番号以外は --fs にそろえる */
  .section {
    margin-bottom: 18px;
  }
  .section-title {
    font-size: var(--fs);
    font-weight: 600;
    color: #444;
    margin-bottom: 10px;
    border-left: 4px solid #4472C4;
    padding-left: 8px;
  }
  /* 入力は「湯量・豆量・味わい・濃さ」を1行に並べ、ラベルは欄の上（ユーザーの図どおり）。
     下の履歴も同じ列幅で並べ、各値が入力欄の真下に来るようにする */
  .inrow, .hist-row {
    display: grid;
    grid-template-columns: 0.9fr 0.8fr 1.3fr 1.15fr;
    gap: 6px;
  }
  label {
    display: block;
    font-size: var(--fs);
    color: #444;
    text-align: center;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  input[type="number"], select {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 48px; /* タップしやすい高さ */
    padding: 6px 4px;
    font-size: var(--fs); /* 16px 未満だと iOS で自動ズームする */
    text-align: center;
    text-align-last: center; /* select の表示中の値も中央に */
    border: 1.5px solid #ccc;
    border-radius: 6px;
    background-color: #fffbe6;
    color: #222;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    /* appearance を消すと iOS で矢印が出ないので自前で描く */
    padding-right: 18px;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%23666' d='M1 1.5 6 6.5l5-5'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 6px center;
    background-size: 10px 7px;
  }
  /* PC のブラウザが出す上下ボタンを消す（場所を取って数字が中央からずれる） */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]:focus, select:focus {
    outline: none;
    border-color: #4472C4;
  }
  /* 入力の履歴。タップするとその値を入力欄に戻す。今の入力と同じ行は灰色にする */
  .hist {
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 6px 0;
    max-height: 210px;
    overflow-y: auto;
  }
  .hist-row {
    padding: 5px 0;
    font-size: var(--fs);
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hist-row.on { background: #e2e2e2; }
  .hist-empty { padding: 5px 10px; color: #888; font-size: var(--fs); text-align: center; }
  .result {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: var(--fs);
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    min-height: 280px;
    /* 長押しコピーができるように選択を明示的に許可 */
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  /* 注湯テーブルだけは桁を揃えたいので等幅＋折り返し禁止。
     万一はみ出す端末では、この部分だけ横スクロールさせる。 */
  /* AndroidMono は Android 用（下の @font-face）。無いと日本語ページの monospace が桁の間の空いた細い日本語フォントになる */
  .result .sched {
    font-family: "SFMono-Regular", Menlo, Consolas, "AndroidMono", "Courier New", monospace;
    /* 「◀ 経過時間」まで入れた最長行は半角25文字ぶん（◀は全角幅になり得るので約15.5em）。
       スマホでは表だけ結果欄の左右の余白にはみ出させ（下の @media）、その幅で最大限大きくする */
    font-size: clamp(0.9rem, 5.6vw, 1.45rem);
    line-height: 1.75;
    white-space: pre;
    overflow-x: auto;
    margin: 12px 0;
    padding-bottom: 2px;
  }
  .result .header { font-weight: 700; color: #1a5276; }
  /* 表の見出しと「前半40% 完了」は数字より小さくてよい（ユーザー要望）。見出しは .hc の箱で列に揃える。
     大きさは表の外の文字にそろえる */
  .result .sched .small { font-size: var(--fs); }
  /* 漢字は同じ大きさでも数字より大きく見えるので、「抽出完了」は数字より一回り小さく（ユーザー要望） */
  .result .sched .kanji { font-size: 0.85em; }
  /* 見出し・区切り線・「前半40% 完了」は行の高さを詰める。インラインのままだと数字の行と同じ高さ（1.75倍）になるのでブロックにする */
  .result .sched .tight { line-height: 1.3; }
  /* 表の見出しの列の箱。幅は数字の文字幅（ch）。中の文字が箱より広くても中央・右に寄せたまま左右にはみ出させる */
  .result .sched .hc { display: inline-flex; vertical-align: bottom; }
  .result .sched .rule { line-height: 1; }
  /* 注記の最終行の右端にバージョン番号。float を注記の中に収める */
  .result .note { display: flow-root; }
  .result .ver { float: right; margin-left: 1em; font-size: 0.75em; line-height: 2; color: #999; }
  /* 文字は疑似要素で出す。innerText に入らないので「結果をコピー」に混ざらない */
  .result .ver::after { content: attr(data-v); }
  /* 音声ガイド中の進捗マーク */
  .result .mark {
    color: #c0392b;
    font-weight: 700;
    animation: markBlink 1.4s ease-in-out infinite;
  }
  @keyframes markBlink { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) {
    .result .mark { animation: none; }
  }
  .result .green { color: #1e8449; }
  .result .blue { color: #2471a3; }
  .result .orange { color: #b9770e; }
  .btns {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    flex: 1 1 0; /* 文字数に関係なく同じ幅で並べる */
    min-width: 0;
    min-height: 44px;
    padding: 10px;
    font-size: var(--fs);
    white-space: nowrap;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #fff;
    font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  /* 見出しの右に操作ボタンを置く行（「注湯スケジュール」＋音声ガイド） */
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .title-row .section-title { margin-bottom: 0; white-space: nowrap; } /* 幅の狭い Android（360px）で2行に割れないように */
  /* 音声ガイドは主役の操作なので、スケジュールの見出しの右に置く（ユーザー要望） */
  .btn-guide {
    flex: 0 0 auto;
    padding: 8px 12px;
    background: #1e8449;
  }
  .btn-guide:hover { background: #196f3d; }
  .btn-guide.running { background: #c0392b; }
  .btn-guide.running:hover { background: #a93226; }
  .btn-copy { background: #5d6d7e; }
  .btn-copy:hover { background: #4a5568; }
  .btn-reset { background: #a0a8b0; }
  .btn-reset:hover { background: #8a929a; }
  /* ①②が使えない環境向けの手動コピー欄。
     書式を持たない textarea なので、長押しコピーでもプレーンテキストのまま貼り付けられる。 */
  .manual { margin-top: 14px; }
  .manual-hint {
    font-size: var(--fs);
    color: #b9770e;
    margin-bottom: 6px;
  }
  .manual-reason {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 6px;
    word-break: break-all;
  }
  .manual-reason:empty { display: none; }
  .manual textarea {
    display: block;
    width: 100%;
    height: 170px;
    padding: 10px;
    font-family: "SFMono-Regular", Menlo, Consolas, "AndroidMono", "Courier New", monospace;
    font-size: 16px; /* iOS の自動ズーム回避 */
    line-height: 1.5;
    border: 1.5px solid #ccc;
    border-radius: 6px;
    background: #fff;
    color: #222;
    resize: vertical;
    -webkit-user-select: text;
    user-select: text;
  }
  .btn-close {
    width: 100%;
    margin-top: 8px;
    background: #a0a8b0;
  }
  .btn-close:hover { background: #8a929a; }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: var(--fs);
    line-height: 1.4;
    text-align: center;
    max-width: calc(100% - 32px); /* 長いメッセージでも画面からはみ出さない */
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* スマートフォン（iPhone 等の狭い画面） */
  @media (max-width: 430px) {
    .card { padding: 20px 8px 18px; border-radius: 10px; }
    h1 { font-size: 1.3rem; margin-bottom: 14px; } /* 本文（--fs）より大きく */
    .result { padding: 12px 11px; }
    .result .sched { margin-left: -9px; margin-right: -9px; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>4：6メソッド</h1>

  <div class="section">
    <div class="section-title">入力</div>
    <div class="inrow">
      <div>
        <label for="total">湯量</label>
        <input type="number" id="total" value="300" min="10" step="10" inputmode="numeric" oninput="calc()" onchange="normalizeTotal()">
      </div>
      <div>
        <label for="dose">豆量</label>
        <input type="number" id="dose" value="20" min="1" step="0.5" inputmode="decimal" oninput="calc()" onchange="normalizeDose()">
      </div>
      <div>
        <label for="sweet">味わい</label>
        <select id="sweet" onchange="calc()">
          <option value="甘い">甘い</option>
          <option value="バランス" selected>バランス</option>
          <option value="明るい">明るい</option>
        </select>
      </div>
      <div>
        <label for="strength">濃さ</label>
        <select id="strength" onchange="calc()">
          <option value="薄め">薄め</option>
          <option value="標準" selected>標準</option>
          <option value="濃いめ">濃いめ</option>
        </select>
      </div>
    </div>
    <div class="hist" id="hist"></div>
  </div>

  <div class="section">
    <div class="title-row">
      <div class="section-title">注湯スケジュール</div>
      <button class="btn-guide" id="guideBtn" onclick="toggleGuide()">音声ガイド開始</button>
    </div>
    <div class="result" id="result"></div>
  </div>

  <div class="btns">
    <button class="btn-copy" onclick="copyResult()">結果をコピー</button>
    <button class="btn-reset" onclick="resetSettings()">初期値に戻す</button>
  </div>

  <div class="manual" id="manual" hidden>
    <p class="manual-hint">下のテキストを長押しして「コピー」を選んでください。</p>
    <p class="manual-reason" id="manualReason"></p>
    <textarea id="manualText" readonly inputmode="none"></textarea>
    <button class="btn-close" onclick="hideManual()">閉じる</button>
  </div>
</div>

<div class="toast" id="toast">コピーしました</div>

<script>
const APP_VERSION = 'v1.63'; // 画面の注記の右端に出す。変更してサーバに上げるたびに進める
const STORAGE_KEY = 'coffee46.settings.v1';
const DEFAULTS = { dose: '20', total: '300', sweet: 'バランス', strength: '標準' };
let scheduleData = null; // 直近の計算結果。音声ガイドがこれを読む

// 設定をブラウザ（localStorage）に保存。プライベートモード等で失敗しても計算は続行する。
function saveSettings() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      dose: document.getElementById('dose').value,
      total: String(roundTotal(document.getElementById('total').value)),
      sweet: document.getElementById('sweet').value,
      strength: document.getElementById('strength').value
    }));
  } catch (e) { /* 保存できない環境では何もしない */ }
}

function loadSettings() {
  let saved = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) saved = JSON.parse(raw);
  } catch (e) { saved = null; }
  if (!saved || typeof saved !== 'object') return;

  if (saved.dose !== undefined) document.getElementById('dose').value = saved.dose;
  const savedTotal = roundTotal(saved.total); // 丸め導入前に保存された値にも対応
  if (savedTotal > 0) document.getElementById('total').value = savedTotal;
  applySelect('sweet', saved.sweet);
  applySelect('strength', saved.strength);
}

// 保存値が選択肢に無い場合（将来の項目変更など）は既定のままにする
function applySelect(id, value) {
  const el = document.getElementById(id);
  if (value === undefined) return;
  const ok = Array.prototype.some.call(el.options, o => o.value === value);
  if (ok) el.value = value;
}

/* 入力の履歴。音声ガイドを始めたとき（＝実際に淹れたとき）の入力を新しい順に残す。
   同じ組み合わせ（湯量・豆量・味わい・濃さ）がすでにあれば追加しない。 */
const HISTORY_KEY = 'coffee46.history.v1';
const HISTORY_MAX = 3; // 履歴は3件まで（ユーザー要望）

function loadHistory() {
  try {
    const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(h) ? h.slice(0, HISTORY_MAX) : []; // 件数を減らす前に保存された分も切り詰める
  } catch (e) { return []; }
}

function currentEntry() {
  return {
    total: roundTotal(document.getElementById('total').value),
    dose: fmtNum(parseFloat(document.getElementById('dose').value) || 0),
    sweet: document.getElementById('sweet').value,
    strength: document.getElementById('strength').value
  };
}

const sameEntry = (a, b) =>
  a.total === b.total && a.dose === b.dose && a.sweet === b.sweet && a.strength === b.strength;

function addHistory() {
  const cur = currentEntry(), h = loadHistory();
  if (h.some(e => sameEntry(e, cur))) return;
  h.unshift(cur);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_MAX))); } catch (e) { /* noop */ }
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById('hist'), h = loadHistory(), cur = currentEntry();
  if (!h.length) {
    box.innerHTML = '<div class="hist-empty">音声ガイドを始めると、ここに履歴が残ります</div>';
    return;
  }
  box.innerHTML = h.map((e, i) =>
    `<div class="hist-row${sameEntry(e, cur) ? ' on' : ''}" onclick="pickHistory(${i})">` +
    `<span>${e.total}</span><span>${e.dose}</span><span>${e.sweet}</span><span>${e.strength}</span></div>`).join('');
}

function pickHistory(i) {
  const e = loadHistory()[i];
  if (!e || sameEntry(e, currentEntry())) return; // 今と同じなら計算し直さない（音声ガイドを止めない）
  document.getElementById('total').value = e.total;
  document.getElementById('dose').value = e.dose;
  applySelect('sweet', e.sweet);
  applySelect('strength', e.strength);
  calc();
}

function resetSettings() {
  document.getElementById('dose').value = DEFAULTS.dose;
  document.getElementById('total').value = DEFAULTS.total;
  document.getElementById('sweet').value = DEFAULTS.sweet;
  document.getElementById('strength').value = DEFAULTS.strength;
  // 履歴も消す（ユーザー要望）
  try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(HISTORY_KEY); } catch (e) { /* noop */ }
  calc();
  showToast('初期値に戻し、履歴を消しました');
}

let toastTimer = null;
function showToast(msg, ms) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer); // 連続表示で前の消去タイマーに消されないように
  toastTimer = setTimeout(() => toast.classList.remove('show'), ms || 1800);
}

// 総湯量は10g単位で扱う。入力途中（例: "2" と打った瞬間）に 0 にならないよう最低 10g。
function roundTotal(v) {
  const n = parseFloat(v);
  if (!(n > 0)) return 0;
  return Math.max(10, Math.round(n / 10) * 10);
}

// 入力確定時（フォーカスが外れた・Enter）に欄の表示も丸めた値へ書き換える。
// 入力中に書き換えると打鍵を邪魔するので oninput ではやらない。
function normalizeTotal() {
  const el = document.getElementById('total');
  let r = roundTotal(el.value);
  // 空のまま確定したら、豆量から 1:15 で埋める（10g 単位、ユーザー要望 v1.62）
  if (el.value.trim() === '') r = roundTotal((parseFloat(document.getElementById('dose').value) || 0) * 15);
  if (r > 0) el.value = r;
  calc();
}

// 豆量を空のまま確定したら、湯量から 1:15 で埋める（1g 単位、ユーザー要望 v1.62）
function normalizeDose() {
  const el = document.getElementById('dose');
  if (el.value.trim() === '') {
    const total = roundTotal(document.getElementById('total').value);
    if (total > 0) el.value = Math.max(1, Math.round(total / 15));
  }
  calc();
}

// 20 → "20"、15.5 → "15.5"（不要な .0 を付けない）
function fmtNum(n) {
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}

function calc() {
  renderHistory(); // 今の入力と同じ履歴の行を灰色にする
  const dose = parseFloat(document.getElementById('dose').value) || 0;
  const total = roundTotal(document.getElementById('total').value);
  const sweet = document.getElementById('sweet').value;
  const strength = document.getElementById('strength').value;
  const el = document.getElementById('result');

  if (dose <= 0 || total <= 0) {
    el.innerHTML = '豆の量と総湯量は正の数字を入力してください。';
    scheduleData = null;
    if (guide.running) stopGuide('設定が変わったので音声ガイドを止めました');
    return;
  }

  const ratio = total / dose;
  const first40 = total * 0.4;
  const last60 = total * 0.6;

  let pour1_raw, style;
  if (sweet === '甘い') {
    pour1_raw = first40 * (50 / 120);
    style = '甘い(まろやか)';
  } else if (sweet === '明るい') {
    pour1_raw = first40 * (70 / 120);
    style = '明るい(酸味強調)';
  } else {
    pour1_raw = first40 / 2;
    style = 'バランス';
  }
  // 1投目・2投目は10の位で四捨五入
  let pour1 = Math.round(pour1_raw / 10) * 10;
  let pour2 = first40 - pour1;
  if (pour2 < 0) { pour2 = 0; pour1 = first40; }

  let lastPours, times, strengthLabel;
  // 薄め=1回 / 標準=2回 / 濃いめ=3回
  // 各投を10の位で四捨五入し、最後の投で辻褄合わせ
  if (strength === '薄め') {
    lastPours = [last60];
    times = ['1:30'];
    strengthLabel = '薄め(あっさり)';
  } else if (strength === '標準') {
    const p1 = Math.round((last60 / 2) / 10) * 10;
    const p2 = last60 - p1;
    lastPours = [p1, p2];
    times = ['1:30', '2:30'];
    strengthLabel = '標準';
  } else {
    const p1 = Math.round((last60 / 3) / 10) * 10;
    const p2 = Math.round((last60 / 3) / 10) * 10;
    const p3 = last60 - p1 - p2;
    lastPours = [p1, p2, p3];
    // 4:6メソッドのベーシックレシピどおり。後の投ほど間隔を詰め、3:30までに落ち切らせる
    times = ['1:30', '2:10', '2:40'];
    strengthLabel = '濃いめ(コク)';
  }

  // 累計を10g単位で四捨五入し、その差分を各投の量にする（各投も10g単位になる）。
  // 最後の投は累計を総湯量ちょうどに合わせる（総湯量が10g単位なので最後の投も10g単位になる）。
  const totalR = total;
  const rawPours = [pour1, pour2, ...lastPours];
  let cumRaw = 0, prevCum = 0;
  const rows = rawPours.map((p, i) => {
    cumRaw += p;
    const isLast = i === rawPours.length - 1;
    const cum = isLast ? totalR : Math.min(Math.round(cumRaw / 10) * 10, totalR);
    const amount = cum - prevCum;
    prevCum = cum;
    return { amount, cum };
  });
  // 「60g(60g)」形式。桁を揃えるため投量は右寄せにする。
  const pourCell = r => `${(r.amount + 'g').padStart(4)}(${r.cum}g)`;

  // 音声ガイド用。表示と同じ数字をそのまま使う。
  const pourSecs = ['0:00', '0:45'].concat(times).map(parseClock);
  scheduleData = {
    sweet, strength, total: totalR,
    pours: rows.map((r, i) => ({ n: i + 1, at: pourSecs[i], amount: r.amount, cum: r.cum })),
    endAt: parseClock('3:30')
  };
  if (guide.running) stopGuide('設定が変わったので音声ガイドを止めました');

  // 見出し・注記は折り返し可、テーブルだけ等幅で桁を揃える（.sched）
  let html = `<div><span class="header">【${style}×${strengthLabel}】</span>\n`;
  // iPhone の幅で1行に収まるよう、空白は詰めてある（全角の「／」は字の中に余白がある）
  html += `豆量${fmtNum(dose)}g／総湯量${totalR}g／比率1:${Math.round(ratio)}</div>`;

  html += `<div class="sched">`;
  // 文字を大きくするため列の間隔は1文字に詰めてある（2桁の湯量だけ右寄せで1文字増える）
  // 見出しは文字を小さくしつつ、各列の上に揃える。箱の幅は表の数字の文字幅（ch）で決め、
  // 「時間」は 0:00 の上の中央、「投」は回の数字の上の中央、「湯量」は投量（右寄せ）の上に右寄せ、「(累計)」は (60g) の頭から
  const hc = (w, align, text) => `<span class="hc" style="width:${w}ch;justify-content:${align}"><span class="small">${text}</span></span>`;
  html += `<div class="header tight">${hc(4, 'center', '時間')} ${hc(1, 'center', '投')} ${hc(4, 'flex-end', '湯量')}<span class="small">(累計)</span></div>`;
  html += `<div class="rule">------------------</div>`;
  // 各行の末尾に音声ガイドの進捗マーク（◀）を入れる場所を用意しておく
  html += `<span class="green">0:00 1 ${pourCell(rows[0])}</span><span class="mark" id="mk0"></span>\n`;
  html += `<span class="green">0:45 2 ${pourCell(rows[1])}</span><span class="mark" id="mk1"></span>`; // 次の行はブロックなので改行しない
  html += `<div class="small tight"> ── 前半40% 完了 ──</div>`;

  rows.slice(2).forEach((r, i) => {
    html += `<span class="blue">${times[i]} ${i + 3} ${pourCell(r)}</span><span class="mark" id="mk${i + 2}"></span>\n`;
  });

  // 完了後も「◀ 経過時間」を付けるので、半角25文字に収まるよう間隔は1文字、「(予定)」は半角カッコの小さい文字にしてある
  html += `<span class="orange">3:30 <span class="kanji">抽出完了</span><span class="small">(予定)</span></span><span class="mark" id="mkEnd"></span>`;
  html += `</div>`;

  clearMarks(); // 完了後の時計が残っていたら止める（表を作り直すと同じ id の行ができるため）

  html += `<div class="note">推奨湯温 浅煎り93℃ /中煎り88℃ /深煎り83℃  推奨挽き中粗〜粗挽き 推奨豆比率 1:15 ${totalR}ccで${Math.round(totalR / 15)}g` +
          `<span class="ver" data-v="${APP_VERSION}"></span></div>`;

  el.innerHTML = html;
  saveSettings(); // 有効な入力のみ保存
}

// コピーは3段構え。
//  ① Clipboard API … secure context（https / localhost）が必要
//  ② execCommand('copy') … 画面に出ている textarea を選択して実行
//  ③ その textarea を残して、長押し→コピーしてもらう
//
// ①が「拒否」された場合は Promise の非同期コールバックに入るため、
// そこではユーザー操作の資格が切れていて②を試しても必ず失敗する。よって直接③へ送る。
function copyResult() {
  // 音声ガイド中の進捗マークはコピーに含めない
  const text = document.getElementById('result').innerText.replace(/ ◀/g, '');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    // ユーザー操作直後に同期的に呼ぶ（iOS はこれを外すと拒否される）
    navigator.clipboard.writeText(text).then(
      () => { hideManual(); showToast('コピーしました'); },
      (err) => showManual(text, 'clipboard API が拒否 (' + errName(err) + ')')
    );
    return;
  }

  // ①が無い環境。ユーザー操作中のうちに②を同期実行する。
  legacyCopy(text);
}

function errName(err) {
  return (err && (err.name || err.message)) || '理由不明';
}

// iOS は画面に出ていない要素からのコピーを拒否することがあるため、
// 手動コピー欄の textarea をいったん表示し、それを選択して実行する。
function legacyCopy(text) {
  const ta = showManual(text, null, true);

  if (execCopy(ta, text)) {
    hideManual();
    showToast('コピーしました');
    return;
  }
  setManualReason('自動コピーが効きませんでした');
  focusManual(ta);
  showToast('長押しして「コピー」を選んでください', 3500);
}

// execCommand は「実行できた」だけで true を返し、選択が空なら中身が空のままコピーされる。
// そこで copy イベントを捕まえ、(1) 中身をプレーンテキストで確定させ、
// (2) イベントが発火したかどうかを成功判定に使う。
function execCopy(ta, text) {
  let fired = false;
  const onCopy = (e) => {
    if (!e.clipboardData) return;
    e.clipboardData.setData('text/plain', text); // 選択内容に関係なく本文を書き込む
    e.preventDefault();
    fired = true;
  };
  document.addEventListener('copy', onCopy);

  const prevReadOnly = ta.readOnly;
  let ret = false;
  try {
    // iOS は readOnly のままだと選択範囲が確定しない。
    // キーボードは inputmode="none" で抑止している。
    ta.readOnly = false;
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, 999999);
    ret = document.execCommand('copy');
  } catch (e) {
    ret = false;
  } finally {
    ta.readOnly = prevReadOnly;
    document.removeEventListener('copy', onCopy);
  }
  return ret && fired;
}

// 結果欄を直接選択させると HTML／webarchive フレーバーが載って書式付きで貼られるため、
// 書式を持たない textarea に入れ直してから選択させる。
function showManual(text, reason, quiet) {
  const ta = document.getElementById('manualText');
  ta.value = text;
  document.getElementById('manual').hidden = false;
  void ta.offsetHeight; // 表示を確定させてから選択する

  setManualReason(reason || '');
  if (!quiet) {
    focusManual(ta);
    showToast('長押しして「コピー」を選んでください', 3500);
  }
  return ta;
}

function focusManual(ta) {
  ta.focus();
  try { ta.setSelectionRange(0, ta.value.length); } catch (e) { /* noop */ }
}

function setManualReason(msg) {
  document.getElementById('manualReason').textContent = msg ? '自動コピー不可: ' + msg + diagInfo() : '';
}

// 実機で何が起きているか分かるように環境を併記する
function diagInfo() {
  return ' ／ secure=' + window.isSecureContext +
         ' ／ clipboard=' + !!(navigator.clipboard && navigator.clipboard.writeText) +
         ' ／ ' + location.protocol;
}

function hideManual() {
  document.getElementById('manual').hidden = true;
}

/* ============================================================
   音声ガイド
   ・読み上げ: Web Speech API / カウント音: Web Audio
   ・カウント音は毎秒の水滴の音（ドリッパーからサーバーに落ちる音）、各回の3秒前から「ピッ・ピッ・ピッ・ピー」
   ・iOS は最初の発話がタップ操作の中で起きないと音が出ないため、
     開始ボタンを押した瞬間に1回目を喋らせて解禁する。
   ・時刻判定は開始時刻からの経過秒で行う。setTimeout の数珠つなぎだと
     誤差が積み上がるうえ、iOS では間引かれてズレるため。
   ============================================================ */
const guide = { running: false, timer: null, ctx: null, t0: 0, ctxT0: 0, sounds: [], events: [], markTimer: null };
const MARK_HOLD_MS = 60 * 1000; // 抽出完了後、◀ と時計を残しておく時間
let jaVoice = null;

function pickJaVoice() {
  try {
    const vs = speechSynthesis.getVoices() || [];
    jaVoice = vs.find(v => /^ja/i.test(v.lang)) || null;
  } catch (e) { jaVoice = null; }
}
if (window.speechSynthesis) {
  pickJaVoice();
  speechSynthesis.onvoiceschanged = pickJaVoice; // 端末によっては遅れて揃う
}

function parseClock(s) {
  const [m, sec] = s.split(':').map(Number);
  return m * 60 + sec;
}

// 「1投目」は「いちいんちめ」と読み違えられるため「1回目」を使う（いっかいめ と読まれる）。
// 語尾を上げる「？」は付けない（ユーザー要望）。
function pourWord(n) {
  return `${n}回目。`;
}

// 45 → 「45秒」、90 → 「1分30秒」、180 → 「3分」
function jaTime(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m === 0) return `${s}秒`;
  return s === 0 ? `${m}分` : `${m}分${s}秒`;
}

function speak(text, onDone) {
  if (!window.speechSynthesis) { if (onDone) onDone(); return; }
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.pitch = 1.25; // 声を高めにして、かわいく（ユーザー要望）。1 が標準、0〜2
    if (jaVoice) u.voice = jaVoice;
    if (onDone) {
      let done = false;
      const finish = () => { if (!done) { done = true; onDone(); } };
      u.onend = finish;
      u.onerror = finish;
      // onend が発火しない端末があるので、読み上げ時間の上限で保険をかける
      setTimeout(finish, Math.max(3000, text.length * 220));
    }
    speechSynthesis.speak(u);
  } catch (e) {
    if (onDone) onDone();
  }
}

// 毎秒の音の予定表。各回の3秒前から「ピッ・ピッ・ピッ・ピー」、残りの秒は小さめの水滴の音。
// 先頭は1回目の3秒前（-3秒）、最後は抽出完了の水滴の音。
function buildSounds(sd) {
  const kind = new Map();
  sd.pours.forEach(p => {
    for (let i = 3; i >= 1; i--) kind.set(p.at - i, 'pi');
    kind.set(p.at, 'pii');
  });
  const list = [];
  for (let s = sd.pours[0].at - 3; s <= sd.endAt; s++) list.push({ at: s, kind: kind.get(s) || 'tick' });
  return list;
}

// 予定表のうち1秒先までを ctx の時刻で予約する。ピッも水滴の音も同じ ctx の時計に乗るので
// 間隔が正確に揃う。時間を過ぎてしまった音（裏に回っていた間など）は鳴らさずに捨てる。
function scheduleSounds() {
  const ctx = guide.ctx;
  if (!ctx) return;
  const now = ctx.currentTime;
  while (guide.sounds.length && guide.ctxT0 + guide.sounds[0].at <= now + 1) {
    const s = guide.sounds.shift(), when = guide.ctxT0 + s.at;
    if (when < now - 0.05) continue;
    if (s.kind === 'pi') beep(when, 880, 0.12);
    else if (s.kind === 'pii') beep(when, 1320, 0.55);
    else tick(when);
  }
}

// 毎秒の音。高めで澄んだ水滴の音。
// デスクトップのサンプル「06-H4_当たる音＋泡_かなり高い＋当たる音も高め（上下1%）」で決まった音（ユーザー選択）。
//   当たる音 … 水面に当たる一瞬の「チッ」（5kHz より上の雑音・約4ms）
//   泡の音   … 落ちた滴が水中に作る泡が震える音。van den Doel の泡モデルで、
//              減衰する正弦波の音程が f0(1 + ξ·d·t) と少し上がる（f0 2300Hz・ξ 0.15）
//   出口     … 部屋の響き（1.2秒。サンプル「E2_響きを長く」で決定）を足す
// 音量は v1.40 と平均の大きさ（RMS）で合わせた 0.18 から、ユーザー要望で 0.09 → 0.045 と下げた。
const DRIP_GAIN = 0.045;
let noiseBuf = null;
function tick(when) {
  const ctx = guide.ctx;
  if (!ctx) return;
  const out = dripBus(ctx);

  if (!noiseBuf || noiseBuf.sampleRate !== ctx.sampleRate) {
    noiseBuf = ctx.createBuffer(1, Math.round(ctx.sampleRate * 0.01), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const src = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = noiseBuf;
  hp.type = 'highpass';
  hp.frequency.value = 5000;
  g.gain.setValueAtTime(0.4 * DRIP_GAIN, when);
  g.gain.exponentialRampToValueAtTime(0.0001 * DRIP_GAIN, when + 0.004);
  src.connect(hp); hp.connect(g); g.connect(out);
  src.start(when);
  src.stop(when + 0.006);

  // 泡の音程は1滴ごとに上下1%だけ揺らす（毎回まったく同じだと機械的に聞こえる）
  bubble(ctx, when + 0.008, 2300 * (0.99 + Math.random() * 0.02), 0.15, 0.5 * DRIP_GAIN, out);
}

// 泡の音。d は減衰の速さ（1/秒）で、泡が大きい（音が低い）ほどゆっくり消える
function bubble(ctx, when, f0, xi, peak, out) {
  const d = 0.043 * f0 + 0.0014 * Math.pow(f0, 1.5), len = 6 / d; // len でほぼ消える
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(f0, when);
  osc.frequency.linearRampToValueAtTime(f0 * (1 + xi * d * len), when + len);
  gain.gain.setValueAtTime(0, when);
  gain.gain.linearRampToValueAtTime(peak, when + 0.001);
  gain.gain.setTargetAtTime(0, when + 0.001, 1 / d);
  osc.connect(gain); gain.connect(out);
  osc.start(when);
  osc.stop(when + len + 0.01);
}

// 水滴の音の出口。ctx ごとに1つ作って使い回す（ガイドを始めるたびに ctx は作り直される）
function dripBus(ctx) {
  if (ctx.dripBus) return ctx.dripBus;
  const input = ctx.createGain();
  input.connect(ctx.destination);

  // 部屋の響き: 1.2秒で消えていく雑音を畳み込む
  const len = Math.round(ctx.sampleRate * 1.2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  const conv = ctx.createConvolver(), wet = ctx.createGain();
  conv.buffer = ir;
  wet.gain.value = 0.9;
  input.connect(conv); conv.connect(wet); wet.connect(ctx.destination);

  ctx.dripBus = input;
  return input;
}

function beep(when, freq, dur, peak) {
  const ctx = guide.ctx;
  if (!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, when);
  gain.gain.exponentialRampToValueAtTime(peak || 0.6, when + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(when);
  osc.stop(when + dur + 0.05);
}

function toggleGuide() {
  if (guide.running) { stopGuide(); return; }
  startGuide();
}

function startGuide() {
  const sd = scheduleData;
  if (!sd) { showToast('先に豆の量と総湯量を入力してください'); return; }

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    guide.ctx = new AC();
    guide.ctx.resume();
  } catch (e) {
    guide.ctx = null; // 音が出なくても読み上げだけは続ける
  }

  addHistory();
  guide.running = true;
  clearMarks(); // 前回の抽出終了マークが残っているので消す
  setGuideBtn(true);
  syncWakeLock();

  const first = sd.pours[0];
  // 「淹れ方」は「えんれほう」と読まれてしまうのでひらがなにする。
  // 体言止めで話す（開始の「いれかたです」「お湯は…グラムです」「スタートします」だけは丁寧に）。語尾を上げる「？」は付けない（ユーザー要望）
  const intro = `「${sd.sweet}」、「${sd.strength}」の、いれかたです。お湯は${sd.total}グラムです。` +
                `${pourWord(first.n)}スタートします。${first.amount}グラム。`;
  // 読み上げが終わってからカウントダウン。「ピー」の瞬間が0秒。
  speak(intro, () => { if (guide.running) beginTimeline(sd); });
}

function beginTimeline(sd) {
  const lead = 0.4;
  guide.t0 = Date.now() + (lead + 3) * 1000;
  guide.sounds = buildSounds(sd);
  if (guide.ctx) guide.ctxT0 = guide.ctx.currentTime + lead + 3;
  scheduleSounds();

  guide.events = [];
  // 各投の時刻ちょうど（「ピー」の瞬間）に ◀ をその行へ移す
  sd.pours.forEach((p, i) => {
    guide.events.push({ at: p.at, fn: () => setMark('mk' + i) });
  });
  sd.pours.slice(1).forEach(p => {
    guide.events.push({ at: p.at - 9, fn: () =>
      speak(`${pourWord(p.n)}${jaTime(p.at)}。${p.amount}グラム、累計${p.cum}グラム。`) });
  });
  guide.events.push({ at: sd.endAt, fn: () => {
    setMark('mkEnd'); // 完了後も時計は進め続け、MARK_HOLD_MS 後に消す（stopGuide 後は tickMark が引き継ぐ）
    speak(`${jaTime(sd.endAt)}。抽出完了予定時間です。`);
  } });
  guide.events.sort((a, b) => a.at - b.at);

  guide.endAt = sd.endAt;
  guide.timer = setInterval(tickGuide, 200);
}

function tickGuide() {
  const elapsed = elapsedSec();
  scheduleSounds();
  while (guide.events.length && guide.events[0].at <= elapsed) {
    guide.events.shift().fn();
  }
  updateMark(elapsed);
  // 最後まで流れきった場合は「抽出完了」の ◀ と時計を残したまま終わる
  if (elapsed > guide.endAt + 5) stopGuide(null, true);
}

// ガイド終了後、「抽出完了」の時計だけを進める。消す時刻も経過秒で判定する。
function tickMark() {
  const elapsed = elapsedSec();
  if (elapsed >= guide.endAt + MARK_HOLD_MS / 1000) clearMarks();
  else updateMark(elapsed);
}

function updateMark(elapsed) {
  if (!guide.markId) return;
  const el = document.getElementById(guide.markId);
  if (el) el.textContent = ' ◀ ' + mmss(elapsed);
}

function stopGuide(msg, keepMark) {
  guide.running = false;
  clearInterval(guide.timer);
  guide.timer = null;
  guide.events = [];
  guide.sounds = [];
  try { speechSynthesis.cancel(); } catch (e) { /* noop */ }
  if (guide.ctx) { try { guide.ctx.close(); } catch (e) { /* noop */ } guide.ctx = null; }
  if (!keepMark) clearMarks();
  else if (guide.markId) {
    clearInterval(guide.markTimer);
    guide.markTimer = setInterval(tickMark, 200);
  }
  setGuideBtn(false);
  syncWakeLock(); // 完了後の時計が出ている間は持ち続ける
  if (msg) showToast(msg);
}

// 進捗マークは1か所だけ。表示中のものを消してから付け替える。
function setMark(id) {
  clearMarks();
  const el = document.getElementById(id);
  if (!el) return;
  guide.markId = id;
  updateMark(elapsedSec());
}

function clearMarks() {
  clearInterval(guide.markTimer); // 完了後の時計が動いていたら止める
  guide.markTimer = null;
  guide.markId = null;
  const marks = document.querySelectorAll('.result .mark');
  for (let i = 0; i < marks.length; i++) marks[i].textContent = '';
  syncWakeLock();
}

function elapsedSec() {
  return (Date.now() - guide.t0) / 1000;
}

function mmss(sec) {
  const s = Math.max(0, Math.floor(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function setGuideBtn(running) {
  const b = document.getElementById('guideBtn');
  b.textContent = running ? '音声ガイド停止' : '音声ガイド開始';
  b.classList.toggle('running', running);
}

/* ============================================================
   画面を消さない（Screen Wake Lock）
   あるべき状態 = 動作中（音声ガイド中、または抽出完了後の時計が出ている間）。
   取得と解放は syncWakeLock() だけで行う。画面が裏に回るとブラウザが勝手に
   解放するので、戻った時に取り直す。https で開いたときだけ有効。
   ============================================================ */
let wakeLock = null;
let wakeRequesting = false;
let notifiedWakeUnsupported = false;

function syncWakeLock() {
  const want = (guide.running || !!guide.markTimer) && document.visibilityState === 'visible';
  const held = wakeLock && !wakeLock.released;
  if (want === !!held) return;
  if (!want) {
    const w = wakeLock;
    wakeLock = null;
    if (w) w.release().catch(() => {});
    return;
  }
  if (wakeRequesting) return;
  if (!('wakeLock' in navigator)) {
    if (!notifiedWakeUnsupported) {
      notifiedWakeUnsupported = true;
      showToast('この端末では画面の自動消灯を止められません');
    }
    return;
  }
  wakeRequesting = true;
  navigator.wakeLock.request('screen').then(w => {
    wakeRequesting = false;
    wakeLock = w;
    syncWakeLock(); // 取得中に止められていたら即座に手放す
  }, () => {
    wakeRequesting = false;
  });
}
document.addEventListener('visibilitychange', syncWakeLock);

loadSettings(); // 前回の設定を復元
calc();         // 初期表示
</script>

  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* 未対応でも本体は動く */ });
    });
  }
</script>
